<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Usage</title>
		<link rel="stylesheet" href="lib/pi.css" />
	</head>
	<body>
		<h1>Usage</h1>
		<div class="row">
			<label for="provider">Provider</label>
			<select id="provider" data-setting="providerId">
				<option value="">Default (Codex)</option>
				<option value="codex">Codex</option>
			</select>
		</div>
		<div class="row">
			<label for="window-mode">Window</label>
			<select id="window-mode" data-setting="windowMode">
				<option value="auto">Auto (most constrained)</option>
				<option value="pinned">Pinned</option>
			</select>
		</div>
		<div class="row" data-when="windowMode=pinned">
			<label for="window-id">Window ID</label>
			<input id="window-id" type="text" placeholder="default.primary" data-setting="windowId" />
		</div>
		<p class="hint" data-when="windowMode=pinned">
			A pinned window that disappears shows <code>--</code>; it is never swapped silently.
		</p>
		<div class="row">
			<label for="display-mode">Show</label>
			<select id="display-mode" data-setting="displayMode">
				<option value="used">Used %</option>
				<option value="remaining">Remaining %</option>
			</select>
		</div>
		<div class="row">
			<label for="warn">Warn at %</label>
			<input id="warn" type="number" min="0" max="100" placeholder="75" data-setting="warnAtPercent" />
		</div>
		<div class="row">
			<label for="danger">Alert at %</label>
			<input id="danger" type="number" min="0" max="100" placeholder="90" data-setting="dangerAtPercent" />
		</div>
		<div class="row">
			<label for="reset">Show reset</label>
			<input id="reset" type="checkbox" data-setting="showResetAt" />
		</div>
		<fieldset>
			<legend>Plugin settings</legend>
			<div class="row">
				<label for="codex-exe">Codex CLI</label>
				<input
					id="codex-exe"
					type="text"
					placeholder="codex"
					data-setting="codexExecutable"
					data-scope="global"
				/>
			</div>
			<p class="hint">Leave empty to use <code>codex</code> from PATH.</p>
			<div class="row">
				<label for="codex-health">Health check</label>
				<input
					id="codex-health"
					type="number"
					min="15000"
					step="15000"
					placeholder="120000"
					data-setting="codexHealthCheckIntervalMs"
					data-scope="global"
				/>
			</div>
			<p class="hint">Milliseconds between background usage refreshes.</p>
			<div class="row">
				<label for="debug">Debug logging</label>
				<input id="debug" type="checkbox" data-setting="debugLogging" data-scope="global" />
			</div>
			<p class="hint">Credentials are redacted at every log level.</p>
		</fieldset>
		<script src="lib/pi.js"></script>
	</body>
</html>
