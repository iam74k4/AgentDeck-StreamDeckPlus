<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Deny</title>
		<link rel="stylesheet" href="lib/pi.css" />
	</head>
	<body>
		<h1>Deny</h1>
		<div class="row">
			<label for="provider">Provider</label>
			<select id="provider" data-setting="providerId">
				<option value="">Any provider</option>
				<option value="codex">Codex</option>
			</select>
		</div>
		<p class="hint">
			Refuses the waiting request on a single press, whatever its risk. The agent keeps working and can try
			something else; use <strong>Stop Agent</strong> to end the turn instead.
		</p>
		<script src="lib/pi.js"></script>
	</body>
</html>
